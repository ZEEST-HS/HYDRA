name: hydra_pos
description: "Hydra POS - caisse et gestion de boutique (Maroc), hors ligne."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Storage
  sqflite: ^2.4.5
  path: ^1.9.1
  path_provider: ^2.1.5

  # Formatting / network
  intl: ^0.20.3
  http: ^1.6.0

  # Scanning
  mobile_scanner: ^7.4.2

  # Documents
  pdf: ^3.11.0
  printing: ^5.14.3
  share_plus: ^13.3.1
  file_picker: ^13.1.0

  # Import / export
  csv: ^8.0.0
  excel: ^4.0.6

  # Thermal printing (Android)
  print_bluetooth_thermal: ^1.2.5

  # Charts
  fl_chart: ^1.3.0

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/
  fonts:
    - family: NotoSans
      fonts:
        - asset: assets/fonts/NotoSans-Regular.ttf
    - family: NotoSansArabic
      fonts:
        - asset: assets/fonts/NotoSansArabic-Regular.ttf
        - asset: assets/fonts/NotoSansArabic-Bold.ttf
          weight: 700
